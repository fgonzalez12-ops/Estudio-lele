<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeKids v2</title>
<style>
body{margin:0;background:#fff8e8;font-family:Arial}
.wrap{max-width:430px;margin:auto;background:#fff;min-height:100vh;border-left:4px solid #222;border-right:4px solid #222}
h1{margin:0;padding:14px;background:#ffd4e6;text-align:center}
.player{padding:12px;border-bottom:3px dashed #999}
.name{font-weight:bold;font-size:22px}
.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.item{padding:8px 10px;border:2px solid #222;border-radius:12px;background:#fafafa;cursor:pointer}
.item.sel{background:#c8ffd4}
.actions{display:flex;justify-content:space-around}
button{font-size:28px;padding:10px 18px;border:none;border-radius:16px;cursor:pointer}
.no{background:#ffb6b6}.add{background:#ffe48a}.ok{background:#bff5bf}
#status{text-align:center;padding:14px;font-size:22px;font-weight:bold}
dialog{border:none;border-radius:16px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{border:1px solid #aaa;padding:8px;border-radius:10px;cursor:pointer;text-align:center}
</style></head><body>
<div class='wrap'>
<h1>🎁 TradeKids</h1>

<div class='player'>
<div class='name'>👧 Helena</div>
<div id='p1' class='items'></div>
<div class='actions'>
<button class='no' onclick='reject(1)'>❌</button>
<button class='add' onclick='openAdd(1)'>➕</button>
<button id='ok1' class='ok' onclick='accept(1)'>✅</button>
</div>
</div>

<div id='status'>🤝 Negociando...</div>

<div class='player'>
<div class='name'>👦 Tomás</div>
<div id='p2' class='items'></div>
<div class='actions'>
<button class='no' onclick='reject(2)'>❌</button>
<button class='add' onclick='openAdd(2)'>➕</button>
<button id='ok2' class='ok' onclick='accept(2)'>✅</button>
</div>
</div>
</div>

<dialog id='dlg'>
<h3>Elegí un objeto</h3>
<div id='grid' class='grid'></div><br>
<button onclick='dlg.close()'>Cerrar</button>
</dialog>

<script>
const catalog=[
"🧸 Peluche","🎀 Moño","🍭 Caramelo","⚽ Pelota","🚗 Auto","🎮 Videojuego","📚 Libro","🦖 Dino","🦕 T-Rex","🧩 Puzzle",
"🪀 YoYo","🃏 Cartas","🪁 Barrilete","🛹 Skate","🚀 Cohete","🍫 Chocolate","🍪 Galletas","🧃 Jugo","🐱 Gatito","🐶 Perrito",
"⭐ Sticker","💎 Piedra","🎨 Pinturas","✏️ Marcadores","⌚ Reloj","🧢 Gorra","🎁 Sorpresa","🎧 Auriculares","🪙 Moneda","🦄 Unicornio"
];
const p1=["🧸 Peluche","🎀 Moño","🍭 Caramelo","🦄 Unicornio","🧩 Puzzle","🎨 Pinturas","⭐ Sticker","🍫 Chocolate"];
const p2=["⚽ Pelota","🚗 Auto","🎮 Videojuego","📚 Libro","🦖 Dino","🪁 Barrilete","🛹 Skate","🃏 Cartas"];
let current=1,a1=false,a2=false;
function render(id,list){
 const el=document.getElementById(id);
 el.innerHTML="";
 list.forEach(t=>{
  let d=document.createElement("div");
  d.className="item";
  d.textContent=t;
  d.onclick=()=>d.classList.toggle("sel");
  el.appendChild(d);
 });
}
render("p1",p1);render("p2",p2);

function openAdd(player){
 current=player;
 grid.innerHTML="";
 catalog.forEach(c=>{
  let d=document.createElement("div");
  d.className="pick";
  d.textContent=c;
  d.onclick=()=>{
    (player===1?p1:p2).push(c);
    render(player===1?"p1":"p2",player===1?p1:p2);
    a1=false;a2=false;paint();
    status.textContent="🤝 Se agregó un objeto. ¡Sigan negociando!";
    dlg.close();
  };
  grid.appendChild(d);
 });
 dlg.showModal();
}
function paint(){
 ok1.style.background=a1?"#59d96d":"#bff5bf";
 ok2.style.background=a2?"#59d96d":"#bff5bf";
}
function accept(p){
 if(p===1){a1=true;status.textContent="👧 Helena aceptó";}
 else{a2=true;status.textContent="👦 Tomás aceptó";}
 paint();
 if(a1&&a2){
   status.textContent="🎉 ¡INTERCAMBIO REALIZADO! 🎉";
   document.body.animate([{background:"#fff8e8"},{background:"#dfffe0"},{background:"#fff8e8"}],{duration:900});
 }
}
function reject(p){
 a1=false;a2=false;paint();
 status.textContent=(p===1?"👧 Helena":"👦 Tomás")+" rechazó el intercambio 😢";
}
</script>
</body></html>
