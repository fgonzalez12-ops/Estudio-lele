<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>
body{font-family:Arial;background:#fff7df;margin:0}.app{max-width:430px;margin:auto}.sec{padding:10px;border-bottom:3px dashed #bbb}
.offer{min-height:54px;border:2px dashed #666;border-radius:12px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;background:#fff}
.inv{display:flex;flex-wrap:wrap;gap:6px;max-height:170px;overflow:auto;margin:8px 0}.toy{font-size:28px;padding:4px;border:2px solid #aaa;border-radius:10px;cursor:pointer;background:#fff}
.sel{border-color:#ff4fa0;background:#ffe2f1}.actions{display:flex;justify-content:space-around}button{font-size:28px;padding:8px 16px;border:none;border-radius:14px}
canvas{position:fixed;inset:0;pointer-events:none}#msg{text-align:center;font-size:20px;font-weight:bold;padding:8px}
</style></head><body><canvas id='cv'></canvas><div class='app'>
<div class='sec'><h2>👧 Helena</h2><div id='o1' class='offer'></div><div class='inv'><div class='toy' onclick='sel(this)'>🧸</div><div class='toy' onclick='sel(this)'>🦄</div><div class='toy' onclick='sel(this)'>🐱</div><div class='toy' onclick='sel(this)'>🐶</div><div class='toy' onclick='sel(this)'>🐼</div><div class='toy' onclick='sel(this)'>🦁</div><div class='toy' onclick='sel(this)'>🐯</div><div class='toy' onclick='sel(this)'>🦊</div><div class='toy' onclick='sel(this)'>🐸</div><div class='toy' onclick='sel(this)'>🦖</div><div class='toy' onclick='sel(this)'>🦕</div><div class='toy' onclick='sel(this)'>🚗</div><div class='toy' onclick='sel(this)'>🚒</div><div class='toy' onclick='sel(this)'>🚜</div><div class='toy' onclick='sel(this)'>🚀</div><div class='toy' onclick='sel(this)'>✈️</div><div class='toy' onclick='sel(this)'>🚁</div><div class='toy' onclick='sel(this)'>🛹</div><div class='toy' onclick='sel(this)'>🛴</div><div class='toy' onclick='sel(this)'>🚲</div><div class='toy' onclick='sel(this)'>⚽</div><div class='toy' onclick='sel(this)'>🏀</div><div class='toy' onclick='sel(this)'>⚾</div><div class='toy' onclick='sel(this)'>🎾</div><div class='toy' onclick='sel(this)'>🎮</div><div class='toy' onclick='sel(this)'>🎲</div><div class='toy' onclick='sel(this)'>🃏</div><div class='toy' onclick='sel(this)'>🎨</div><div class='toy' onclick='sel(this)'>📚</div><div class='toy' onclick='sel(this)'>⭐</div></div><div class='actions'><button onclick='rej()'>❌</button><button onclick='add(1)'>➕</button><button id='b1' onclick='acc(1)'>✅</button></div></div>
<div id='msg'>🤝 Elegí un juguete y tocá ➕</div>
<div class='sec'><h2>👦 Tomás</h2><div id='o2' class='offer'></div><div class='inv'><div class='toy' onclick='sel(this)'>🚙</div><div class='toy' onclick='sel(this)'>🚓</div><div class='toy' onclick='sel(this)'>🏎️</div><div class='toy' onclick='sel(this)'>🚂</div><div class='toy' onclick='sel(this)'>🛶</div><div class='toy' onclick='sel(this)'>⛵</div><div class='toy' onclick='sel(this)'>🚀</div><div class='toy' onclick='sel(this)'>🤖</div><div class='toy' onclick='sel(this)'>👾</div><div class='toy' onclick='sel(this)'>🐵</div><div class='toy' onclick='sel(this)'>🐨</div><div class='toy' onclick='sel(this)'>🐼</div><div class='toy' onclick='sel(this)'>🦒</div><div class='toy' onclick='sel(this)'>🦓</div><div class='toy' onclick='sel(this)'>🐢</div><div class='toy' onclick='sel(this)'>🐬</div><div class='toy' onclick='sel(this)'>🦈</div><div class='toy' onclick='sel(this)'>⚽</div><div class='toy' onclick='sel(this)'>🏈</div><div class='toy' onclick='sel(this)'>🏐</div><div class='toy' onclick='sel(this)'>🎯</div><div class='toy' onclick='sel(this)'>🎳</div><div class='toy' onclick='sel(this)'>🎸</div><div class='toy' onclick='sel(this)'>🎹</div><div class='toy' onclick='sel(this)'>🥁</div><div class='toy' onclick='sel(this)'>🍕</div><div class='toy' onclick='sel(this)'>🍔</div><div class='toy' onclick='sel(this)'>🍟</div><div class='toy' onclick='sel(this)'>🍩</div><div class='toy' onclick='sel(this)'>🍭</div></div><div class='actions'><button onclick='rej()'>❌</button><button onclick='add(2)'>➕</button><button id='b2' onclick='acc(2)'>✅</button></div></div>
</div>
<script>
let cur=null,a1=false,a2=false;
function sel(e){document.querySelectorAll('.toy').forEach(x=>x!==e&&x.classList.remove('sel'));e.classList.toggle('sel');cur=e;}
function add(p){if(!cur)return;let c=cur.cloneNode(true);c.className='toy';c.onclick=()=>c.remove();document.getElementById('o'+p).appendChild(c);a1=a2=false;paint();msg.textContent='➕ Objeto agregado';}
function paint(){b1.style.background=a1?'#61e56f':'#ddd';b2.style.background=a2?'#61e56f':'#ddd';}
function acc(p){if(p==1)a1=true;else a2=true;paint();if(a1&&a2){msg.textContent='🎉 ¡INTERCAMBIO REALIZADO!';conf();}else msg.textContent='Esperando al otro jugador...';}
function rej(){a1=a2=false;paint();msg.textContent='😢 Cancelado';}
const ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;
function conf(){let P=[...Array(180)].map(()=>({x:Math.random()*cv.width,y:-20,v:2+Math.random()*4,s:4+Math.random()*5,h:Math.random()*360}));let f=0;(function A(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;ctx.fillStyle='hsl('+p.h+',90%,60%)';ctx.fillRect(p.x,p.y,p.s,p.s)});if(f++<160)requestAnimationFrame(A);})();}paint();
</script></body></html>
