<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeKids Prototype</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff8e8;display:flex;justify-content:center;padding:20px}
.phone{width:390px;background:#fff;border:4px solid #222;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.2)}
header{background:#ffd6e7;padding:16px;text-align:center;font-size:28px;font-weight:bold}
.section{padding:16px}
.player{background:#f6f6f6;border-radius:16px;padding:12px;margin-bottom:14px}
.items{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.item{background:#fff;border:2px solid #333;border-radius:14px;padding:10px 14px;cursor:pointer;transition:.2s}
.item:hover{transform:scale(1.08)}
.center{text-align:center;font-size:42px;margin:10px}
.actions{display:flex;justify-content:space-around;padding:18px}
button{font-size:32px;border:none;border-radius:20px;padding:12px 24px;cursor:pointer}
.no{background:#ffb3b3}.add{background:#ffe680}.yes{background:#bdf5c4}
#msg{padding:12px;text-align:center;font-weight:bold;font-size:20px;min-height:28px}
dialog{border:none;border-radius:16px;padding:20px}
input{width:100%;padding:10px;font-size:18px;margin:10px 0}
.small{font-size:18px;padding:10px 16px}
canvas{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="phone">
<header>🎁 TradeKids</header>
<div class="section">
<div class="player">
<b>👧 Helena</b>
<div class="items" id="p1">
<div class="item">🧸 Peluche</div>
<div class="item">🎀 Moño</div>
<div class="item">🍭 Caramelo</div>
</div>
</div>

<div class="center">🤝</div>

<div class="player">
<b>👦 Tomás</b>
<div class="items" id="p2">
<div class="item">⚽ Pelota</div>
<div class="item">🚗 Auto</div>
<div class="item">📚 Libro</div>
</div>
</div>
</div>

<div id="msg"></div>

<div class="actions">
<button class="no" onclick="rejectTrade()">❌</button>
<button class="add" onclick="dlg.showModal()">➕</button>
<button class="yes" onclick="acceptTrade()">✅</button>
</div>
</div>

<dialog id="dlg">
<h2>Agregar objeto</h2>
<input id="txt" placeholder="Ej: 🪀 Yo-yo">
<button class="small" onclick="addItem()">Agregar</button>
<button class="small" onclick="dlg.close()">Cerrar</button>
</dialog>

<script>
let accepted=false;
document.querySelectorAll('.item').forEach(i=>i.onclick=()=>i.style.background='#c9ffd4');

function rejectTrade(){
 accepted=false;
 msg.textContent="😢 No hubo acuerdo";
 document.body.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:250});
}
function acceptTrade(){
 if(!accepted){
   accepted=true;
   msg.textContent="Esperando al otro jugador...";
   setTimeout(()=>{
      msg.textContent="🎉 ¡Intercambio realizado!";
      confetti();
      accepted=false;
   },1200);
 }
}
function addItem(){
 const t=txt.value.trim();
 if(!t)return;
 const d=document.createElement('div');
 d.className='item';
 d.textContent=t;
 d.onclick=()=>d.style.background='#c9ffd4';
 p1.appendChild(d);
 txt.value='';
 dlg.close();
}
const ctx=c.getContext('2d');resize();window.onresize=resize;
function resize(){c.width=innerWidth;c.height=innerHeight}
function confetti(){
 let p=[];
 for(let i=0;i<180;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*300,v:2+Math.random()*4,s:4+Math.random()*6});
 let f=0;
 (function a(){
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach(o=>{o.y+=o.v;ctx.fillStyle=`hsl(${o.y*3%360},80%,60%)`;ctx.fillRect(o.x,o.y,o.s,o.s)});
  if(f++<120)requestAnimationFrame(a); else ctx.clearRect(0,0,c.width,c.height);
 })();
}
</script>
</body>
</html>
